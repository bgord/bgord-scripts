name: Build
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      fasttrack:
        description: "Skip build verify"
        type: boolean
        default: false
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build server
    runs-on: ubuntu-26.04
    env:
      GITLEAKS_VERSION: 8.30.0
      SKIP_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.fasttrack }}
    steps:
      - name: Clone repositories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install node-gyp
        run: bun add -g node-gyp

      - name: Bun install
        run: bun install --exact --frozen-lockfile --no-summary

      - name: Create .env.test file
        env:
          ENV_TEST: ${{ secrets.ENV_TEST }}
        if: ${{ env.SKIP_CHECKS != 'true' }}
        run: echo "${ENV_TEST}" > .env.test

      - name: Read Playwright version
        if: ${{ env.SKIP_CHECKS != 'true' }}
        id: pw
        run: |
          VERSION=$(jq -r '.devDependencies["@playwright/test"] // "unknown"' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ env.SKIP_CHECKS != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Cache TS buildinfo
        if: ${{ env.SKIP_CHECKS != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig*.json') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Read ShellCheck wrapper version
        if: ${{ env.SKIP_CHECKS != 'true' }}
        id: sc
        run: |
          VERSION=$(jq -r '.devDependencies.shellcheck // "unknown"' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache ShellCheck
        if: ${{ env.SKIP_CHECKS != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/shellcheck/bin
          key: shellcheck-${{ runner.os }}-${{ steps.sc.outputs.version }}

      - name: Cache Gitleaks
        if: ${{ env.SKIP_CHECKS != 'true' }}
        id: gl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}

      - name: Install Gitleaks
        if: ${{ env.SKIP_CHECKS != 'true' && steps.gl-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /home/runner/.local/bin
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /home/runner/.local/bin gitleaks

      - name: Add Gitleaks to PATH
        if: ${{ env.SKIP_CHECKS != 'true' }}
        run: echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - parallel:
          - name: Typecheck
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/typecheck.sh
          - name: E2E run
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/e2e-run.sh
          - name: Check dead code
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-dead-code.sh
          - name: Test
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/test.sh
          - name: Check boundaries
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-boundaries.sh
          - name: Check engines
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-engines.sh
          # - name: Check deps audit
          #   if: ${{ env.SKIP_CHECKS != 'true' }}
          # run: ./bgord-scripts/check-deps-audit.sh
          - name: Check lockfile
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-lockfile.sh
          - name: Check shell
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-shell.sh
          - name: Check code
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-code.sh
          - name: Check secrets
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-secrets.sh
          - name: Check drift
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-drift.sh
          - name: Check deps pin
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-deps-pin.sh
          - name: Check deps ensure
            if: ${{ env.SKIP_CHECKS != 'true' }}
            run: ./bgord-scripts/check-deps-ensure.sh

      - name: Build app
        run: ./scripts/server-build-production.sh

      - name: Generate build info
        env:
          SHA: ${{ github.sha }}
        run: ./bgord-scripts/build-info-generate.sh "${SHA}"

      - name: Inspect app size
        if: ${{ env.SKIP_CHECKS != 'true' }}
        run: ./bgord-scripts/server-inspect-production.sh

      - name: Bundle secrets encryptor
        run: bun build --target=bun --outfile output/infra/secrets-encrypt.js bgord-scripts/secrets-encrypt.ts

      - name: Package build output
        run: tar -czf build.tar.gz -C output .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: build.tar.gz
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Publish run id
        env:
          RUN_ID: ${{ github.run_id }}
        run: echo "Deploy with run ID \`${RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
