name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      fasttrack:
        description: "Skip checks"
        type: boolean
        default: false
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-26.04
    if: ${{ github.event.action != 'closed' && !(github.event_name == 'workflow_dispatch' && inputs.fasttrack) }}
    steps:
      - name: Clone repositories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Detect e2e
        id: detect
        run: if test -d infra/e2e; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Bun environment
        if: ${{ steps.detect.outputs.present == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install node-gyp
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: bun add -g node-gyp

      - name: Bun install
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: bun install --exact --frozen-lockfile --no-summary

      - name: Create .env.staging file
        if: ${{ steps.detect.outputs.present == 'true' }}
        env:
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
        run: echo "${ENV_STAGING}" > .env.staging

      - name: Read Playwright version
        if: ${{ steps.detect.outputs.present == 'true' }}
        id: pw
        run: |
          VERSION=$(jq -r '.devDependencies["@playwright/test"] // "unknown"' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ steps.detect.outputs.present == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: E2E run
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: ./bgord-scripts/e2e-run.sh

      - name: Upload Playwright report
        if: ${{ failure() && steps.detect.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            reports/e2e-report/
            reports/e2e-results/
          retention-days: 14
          if-no-files-found: ignore

  checks:
    name: Checks
    runs-on: ubuntu-26.04
    if: ${{ github.event.action != 'closed' && !(github.event_name == 'workflow_dispatch' && inputs.fasttrack) }}
    env:
      GITLEAKS_VERSION: 8.30.0
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - name: Clone repositories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install node-gyp
        run: bun add -g node-gyp

      - name: Bun install
        run: bun install --exact --frozen-lockfile --no-summary

      - name: Create .env.test file
        env:
          ENV_TEST: ${{ secrets.ENV_TEST }}
        run: echo "${ENV_TEST}" > .env.test

      - name: Cache TS buildinfo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig*.json') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Cache ShellCheck
        id: sc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.local/bin/shellcheck
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}

      - name: Install ShellCheck
        if: ${{ steps.sc-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /home/runner/.local/bin
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ -C /home/runner/.local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Cache Gitleaks
        id: gl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}

      - name: Install Gitleaks
        if: ${{ steps.gl-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /home/runner/.local/bin
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /home/runner/.local/bin gitleaks

      - name: Add local binaries to PATH
        run: echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - parallel:
          - name: Typecheck
            run: ./bgord-scripts/typecheck.sh
          - name: Check dead code
            run: ./bgord-scripts/check-dead-code.sh
          - name: Test
            run: ./bgord-scripts/test.sh
          - name: Check boundaries
            run: ./bgord-scripts/check-boundaries.sh
          - name: Check engines
            run: ./bgord-scripts/check-engines.sh
          - name: Check deps audit
            run: ./bgord-scripts/check-deps-audit.sh
          - name: Check lockfile
            run: ./bgord-scripts/check-lockfile.sh
          - name: Check shell
            run: ./bgord-scripts/check-shell.sh
          - name: Check code
            run: ./bgord-scripts/check-code.sh
          - name: Check secrets
            run: ./bgord-scripts/check-secrets.sh
          - name: Check drift
            run: ./bgord-scripts/check-drift.sh
          - name: Check deps pin
            run: ./bgord-scripts/check-deps-pin.sh
          - name: Check deps ensure
            run: ./bgord-scripts/check-deps-ensure.sh

  build:
    name: Build server
    runs-on: ubuntu-26.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Clone repositories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install node-gyp
        run: bun add -g node-gyp

      - name: Bun install
        run: bun install --exact --frozen-lockfile --no-summary

      - name: Build app
        run: ./scripts/server-build-production.sh

      - name: Generate build info
        env:
          SHA: ${{ github.sha }}
        run: ./bgord-scripts/build-info-generate.sh "${SHA}"

      - name: Bundle secrets encryptor
        run: bun build --target=bun --outfile secrets-encrypt.js bgord-scripts/secrets-encrypt.ts

      - name: Package build output
        run: tar -czf build.tar.gz -C output .

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build.tar.gz
            secrets-encrypt.js
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Publish run id
        env:
          RUN_ID: ${{ github.run_id }}
        run: echo "Deploy with run ID \`${RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
