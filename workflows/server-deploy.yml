name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: environment
        required: true
      run_id:
        description: "Build run ID to deploy"
        type: string
        required: true
concurrency:
  group: ci-deploy-${{ inputs.environment }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read # read the build run's artifact across workflow runs
jobs:
  deploy:
    name: Deploy server
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack build output
        run: |
          mkdir -p output
          tar -xzf build.tar.gz -C output

      - name: Report deployed build
        run: cat output/infra/build-info.json

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: Render secrets.enc
        env:
          ENV_SERVER: ${{ secrets.ENV_SERVER }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        run: |
          umask 077
          test -n "$ENV_SERVER" || { echo "ENV_SERVER is empty"; exit 1; }
          test -n "$MASTER_KEY" || { echo "MASTER_KEY is empty"; exit 1; }
          printf '%s\n' "$ENV_SERVER" > "$RUNNER_TEMP/env.production"
          printf '%s\n' "$MASTER_KEY" > "$RUNNER_TEMP/master.key"
          bun output/infra/secrets-encrypt.js \
            --master-key "$RUNNER_TEMP/master.key" \
            --input "$RUNNER_TEMP/env.production" \
            --output "$GITHUB_WORKSPACE/output/secrets.enc"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTNAME }}

      - name: Sync source code
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: rsync -azP output/ "production:/var/www/${PROJECT_NAME}"

      - name: Clean stale public assets
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: if [ -d "output/public" ]; then rsync -azP --delete output/public/ "production:/var/www/${PROJECT_NAME}/public/"; fi

      - name: Restart server
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: ssh production sudo systemctl restart "${PROJECT_NAME}.service"
